name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: deliberately no `registry-url` here. actions/setup-node writes
          # an .npmrc containing a literal `_authToken` placeholder when
          # `registry-url` is set, which conflicts with @semantic-release/npm's
          # own npm authentication (OIDC trusted publishing + token fallback)
          # and can cause spurious EINVALIDNPMTOKEN errors. See:
          # https://semantic-release.gitbook.io/semantic-release/recipes/ci-configurations/github-actions

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Ensure npm CLI supports OIDC trusted publishing
        if: github.event_name == 'workflow_dispatch'
        # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1; the npm
        # version bundled with actions/setup-node's Node 22 may be older, so
        # upgrade it explicitly before semantic-release invokes `npm publish`.
        run: npm install -g npm@latest

      - name: Semantic Release
        if: github.event_name == 'workflow_dispatch'
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: ./packages/lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build:docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
